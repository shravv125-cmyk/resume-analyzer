{% extends "base.html" %}{% block title %}Sign up{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Create your account</h1>
  <p class="muted">Free. Your resumes stay private to you.</p>
  <form method="post">
    <label>Name<input name="name" required autofocus></label>
    <label>Email<input type="email" name="email" required></label>
    <label>Password (6+ characters)<input type="password" name="password" minlength="6" required></label>
    <button class="btn">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
